services:
  fileshare:
    build: .
    image: aurora-fileshare:local
    container_name: aurora-fileshare
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8095}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/swangy/aurora-fileshare}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      DONATE_URL: ${DONATE_URL:-}
      MAX_FILE_SIZE_GB: ${MAX_FILE_SIZE_GB:-0}
      STUN_URLS: ${STUN_URLS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
